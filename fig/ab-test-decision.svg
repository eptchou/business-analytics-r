<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c6e9c"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="360" y="18" width="280" height="52" rx="10" fill="#2c6e9c"/>
  <text x="500" y="50" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">A/B 測試：如何選擇檢定方法？</text>

  <!-- decision 1: 依變數型態 -->
  <polygon points="500,100 660,155 500,210 340,155" fill="#e3edf5" stroke="#2c6e9c" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" fill="#1f4a68" font-size="16" font-weight="700">依變數（指標）</text>
  <text x="500" y="172" text-anchor="middle" fill="#1f4a68" font-size="16" font-weight="700">是哪種型態？</text>

  <!-- arrows from start -->
  <line x1="500" y1="70" x2="500" y2="100" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- branch labels -->
  <line x1="410" y1="185" x2="260" y2="250" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="196" width="104" height="26" rx="13" fill="#fff"/>
  <text x="352" y="214" text-anchor="middle" fill="#2c6e9c" font-size="14" font-weight="700">連續數值</text>

  <line x1="590" y1="185" x2="740" y2="250" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="596" y="196" width="128" height="26" rx="13" fill="#fff"/>
  <text x="660" y="214" text-anchor="middle" fill="#2c6e9c" font-size="14" font-weight="700">類別／比例</text>

  <!-- LEFT: continuous -->
  <polygon points="250,250 380,300 250,350 120,300" fill="#e3edf5" stroke="#2c6e9c" stroke-width="2"/>
  <text x="250" y="296" text-anchor="middle" fill="#1f4a68" font-size="15" font-weight="700">要比較幾組？</text>
  <text x="250" y="316" text-anchor="middle" fill="#1f4a68" font-size="15" font-weight="700">幾個因子？</text>

  <!-- left to t-test -->
  <line x1="185" y1="325" x2="150" y2="415" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="112" y="352" width="66" height="24" rx="12" fill="#fff"/>
  <text x="145" y="369" text-anchor="middle" fill="#2c6e9c" font-size="13" font-weight="700">2 組</text>

  <rect x="55" y="418" width="190" height="66" rx="10" fill="#fff" stroke="#2c6e9c" stroke-width="2"/>
  <text x="150" y="445" text-anchor="middle" fill="#24292e" font-size="15" font-weight="700">兩樣本 t 檢定</text>
  <text x="150" y="469" text-anchor="middle" fill="#b0407d" font-size="14" font-family="monospace">t.test()</text>

  <!-- left to ANOVA -->
  <line x1="300" y1="330" x2="360" y2="415" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="350" width="150" height="24" rx="12" fill="#fff"/>
  <text x="375" y="367" text-anchor="middle" fill="#2c6e9c" font-size="13" font-weight="700">≥ 3 組或多因子</text>

  <rect x="275" y="418" width="200" height="66" rx="10" fill="#fff" stroke="#2c6e9c" stroke-width="2"/>
  <text x="375" y="445" text-anchor="middle" fill="#24292e" font-size="15" font-weight="700">變異數分析 ANOVA</text>
  <text x="375" y="469" text-anchor="middle" fill="#b0407d" font-size="14" font-family="monospace">aov()</text>

  <!-- ANOVA to post-hoc -->
  <line x1="375" y1="484" x2="375" y2="524" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="255" y="527" width="240" height="70" rx="10" fill="#f4f9fc" stroke="#2c6e9c" stroke-width="2"/>
  <text x="375" y="553" text-anchor="middle" fill="#24292e" font-size="14" font-weight="700">顯著後：事後檢定</text>
  <text x="375" y="575" text-anchor="middle" fill="#b0407d" font-size="13" font-family="monospace">TukeyHSD() + test*factor</text>

  <!-- RIGHT: categorical -->
  <polygon points="750,250 880,300 750,350 620,300" fill="#e3edf5" stroke="#2c6e9c" stroke-width="2"/>
  <text x="750" y="305" text-anchor="middle" fill="#1f4a68" font-size="15" font-weight="700">比較的對象？</text>

  <!-- right to z-test -->
  <line x1="690" y1="328" x2="650" y2="415" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="352" width="100" height="24" rx="12" fill="#fff"/>
  <text x="650" y="369" text-anchor="middle" fill="#2c6e9c" font-size="13" font-weight="700">兩組比例</text>

  <rect x="552" y="418" width="196" height="66" rx="10" fill="#fff" stroke="#2c6e9c" stroke-width="2"/>
  <text x="650" y="445" text-anchor="middle" fill="#24292e" font-size="15" font-weight="700">兩比例 z 檢定</text>
  <text x="650" y="469" text-anchor="middle" fill="#b0407d" font-size="14" font-family="monospace">prop.test()</text>

  <!-- right to chisq -->
  <line x1="810" y1="328" x2="860" y2="415" stroke="#2c6e9c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="352" width="130" height="24" rx="12" fill="#fff"/>
  <text x="835" y="369" text-anchor="middle" fill="#2c6e9c" font-size="13" font-weight="700">類別 × 類別</text>

  <rect x="768" y="418" width="180" height="66" rx="10" fill="#fff" stroke="#2c6e9c" stroke-width="2"/>
  <text x="858" y="445" text-anchor="middle" fill="#24292e" font-size="15" font-weight="700">卡方檢定</text>
  <text x="858" y="469" text-anchor="middle" fill="#b0407d" font-size="14" font-family="monospace">chisq.test()</text>

  <!-- bottom reminder -->
  <rect x="150" y="650" width="700" height="72" rx="10" fill="#fff8e6" stroke="#f0ad4e" stroke-width="2"/>
  <text x="500" y="680" text-anchor="middle" fill="#6b5900" font-size="15" font-weight="700">實驗開始前：先做檢定力分析，規劃所需樣本數</text>
  <text x="500" y="703" text-anchor="middle" fill="#8a6d00" font-size="13" font-family="monospace">pwr.t.test() / pwr.anova.test()</text>

  <!-- dashed connectors to reminder -->
  <line x1="150" y1="484" x2="330" y2="650" stroke="#f0ad4e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="858" y1="484" x2="670" y2="650" stroke="#f0ad4e" stroke-width="1.5" stroke-dasharray="5,4"/>
</svg>
